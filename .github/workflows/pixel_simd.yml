name: Pixel SIMD benchmark
on:
  push:
    branches: [dev, 'wallentx/**']
    paths: ['scripts/pixel-validate/**', '.github/workflows/pixel_simd.yml']
  pull_request:
    branches: [dev]
    paths: ['scripts/pixel-validate/**', '.github/workflows/pixel_simd.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pixel-simd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !(github.head_ref == 'dev' || startsWith(github.head_ref, 'wallentx/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Validate Python and shell
        run: |
          python3 -B -m unittest discover -s scripts/pixel-validate -p 'test_*.py'
          bash -n scripts/pixel-validate/native/build.sh
      - name: Install ARM64 correctness-test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
      - name: Test supported kernels, tails, and unsupported dispatch under QEMU
        run: |
          CC=aarch64-linux-gnu-gcc bash scripts/pixel-validate/native/build.sh "$RUNNER_TEMP/linux-simd"
          python3 scripts/pixel-validate/native/check_qemu.py "$RUNNER_TEMP/linux-simd/pixel-simd-bench"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Build Android ARM64 benchmark
        run: |
          sdkmanager 'ndk;29.0.14206865'
          toolchain="$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC="$toolchain/aarch64-linux-android24-clang" bash scripts/pixel-validate/native/build.sh "$RUNNER_TEMP/android-simd"
          "$toolchain/llvm-objdump" -d "$RUNNER_TEMP/android-simd/pixel-simd-bench" > "$RUNNER_TEMP/android-simd/disassembly.txt"
          python3 scripts/pixel-validate/native/check_disassembly.py "$RUNNER_TEMP/android-simd/disassembly.txt"
          mkdir -p artifact
          cp "$RUNNER_TEMP/android-simd/pixel-simd-bench" "$RUNNER_TEMP/android-simd/disassembly.txt" artifact/
          cp scripts/pixel-validate/validate.py docs/PIXEL11_VALIDATION.md artifact/
          "$toolchain/clang" --version > artifact/compiler.txt
          git rev-parse HEAD > artifact/commit.txt
          cd artifact
          sha256sum pixel-simd-bench validate.py disassembly.txt compiler.txt commit.txt PIXEL11_VALIDATION.md > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: pixel-simd-arm64
          path: artifact/
          if-no-files-found: error
