name: Build
on:
  workflow_dispatch:
    inputs:
      all_apks:
        description: 'Build all architectures and all bootstrap variants'
        type: boolean
        default: false
  push:
    branches:
      - master
      - dev
      - 'github-releases/**'
  pull_request:
    branches:
      - master
      - dev
jobs:
  build:
    # Same-repository branches below already build on push (including the dev -> master sync PR).
    # Keep PR validation for fork branches and branches without a push trigger.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !(contains(fromJSON('["master","dev"]'), github.head_ref) || startsWith(github.head_ref, 'github-releases/'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_variant: ${{ fromJSON((inputs.all_apks || vars.TERMUX_BUILD_ALL_APKS == 'true') && '["pacman-android-7","apt-android-7","apt-android-5"]' || '["pacman-android-7"]') }}
    env:
      BUILD_ALL_APKS: ${{ inputs.all_apks || vars.TERMUX_BUILD_ALL_APKS == 'true' }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Setup java 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK and NDK
        run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0' 'ndk;29.0.14206865'
      - name: Build APKs
        shell: bash {0}
        env:
          PACKAGE_VARIANT: ${{ matrix.package_variant }}
        run: |
          exit_on_error() { echo "$1"; exit 1; }

          echo "Setting vars"

          if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
              GITHUB_SHA="${{ github.event.pull_request.head.sha }}" # Do not use last merge commit set in GITHUB_SHA
          fi

          # Set RELEASE_VERSION_NAME to "<CURRENT_VERSION_NAME>+<last_commit_hash>"
          CURRENT_VERSION_NAME_REGEX='\s+versionName "([^"]+)"$'
          CURRENT_VERSION_NAME="$(grep -m 1 -E "$CURRENT_VERSION_NAME_REGEX" ./app/build.gradle | sed -r "s/$CURRENT_VERSION_NAME_REGEX/\1/")"
          RELEASE_VERSION_NAME="v$CURRENT_VERSION_NAME+${GITHUB_SHA:0:7}" # The "+" is necessary so that versioning precedence is not affected
          if ! printf "%s" "${RELEASE_VERSION_NAME/v/}" | grep -qP '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'; then
           exit_on_error "The versionName '${RELEASE_VERSION_NAME/v/}' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html."
          fi

          APK_DIR_PATH="./app/build/outputs/apk/debug"
          APK_VERSION_TAG="$RELEASE_VERSION_NAME-${{ env.PACKAGE_VARIANT }}-github-debug" # Note the "-", GITHUB_SHA will already have "+" before it
          APK_BASENAME_PREFIX="termux-app_$APK_VERSION_TAG"

          # Used by attachment steps later
          {
              echo "APK_DIR_PATH=$APK_DIR_PATH"
              echo "APK_VERSION_TAG=$APK_VERSION_TAG"
              echo "APK_BASENAME_PREFIX=$APK_BASENAME_PREFIX"
          } >> "$GITHUB_ENV"

          echo "Building APKs for 'APK_VERSION_TAG' build"
          export TERMUX_APP_VERSION_NAME="${RELEASE_VERSION_NAME/v/}" # Used by app/build.gradle
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG" # Used by app/build.gradle
          export TERMUX_PACKAGE_VARIANT="${{ env.PACKAGE_VARIANT }}" # Used by app/build.gradle
          build_profile=pixel11
          abis=(arm64-v8a)
          if [ "$BUILD_ALL_APKS" = "true" ]; then
              build_profile=all
              abis=(universal arm64-v8a armeabi-v7a x86_64 x86)
          fi
          if ! ./gradlew :app:assembleDebug -PtermuxBuildProfile="$build_profile"; then
            exit_on_error "Build failed for '$APK_VERSION_TAG' build."
          fi

          echo "Validating APKs"
          apk_files=()
          for abi in "${abis[@]}"; do
            if ! test -f "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_$abi.apk"; then
              files_found="$(ls "$APK_DIR_PATH")"
              exit_on_error "Failed to find built APK at '$APK_DIR_PATH/${APK_BASENAME_PREFIX}_$abi.apk'. Files found: "$'\n'"$files_found"
            fi
            apk_files+=("${APK_BASENAME_PREFIX}_$abi.apk")
          done

          echo "Generating sha256sums file"
          if ! (cd "$APK_DIR_PATH"; sha256sum "${apk_files[@]}" \
            > "${APK_BASENAME_PREFIX}_sha256sums"); then
            exit_on_error "Generate sha25sums failed for '$APK_VERSION_TAG' release."
          fi
      - name: Verify default Pixel APK
        if: env.BUILD_ALL_APKS != 'true'
        shell: bash
        run: |
          apk="$APK_DIR_PATH/${APK_BASENAME_PREFIX}_arm64-v8a.apk"
          apkanalyzer manifest target-sdk "$apk" | grep -x 37
          apkanalyzer manifest version-code "$apk" | grep -x 1000
          python3 - "$apk" <<'PY'
          import hashlib, pathlib, sys, zipfile
          path = pathlib.Path(sys.argv[1])
          assert len(list(path.parent.glob('*.apk'))) == 1, 'Expected one APK'
          with zipfile.ZipFile(path) as apk:
              abis = {n.split('/')[1] for n in apk.namelist() if n.startswith('lib/') and n.endswith('.so')}
              assert abis == {'arm64-v8a'}, abis
              assert hashlib.sha256(apk.read('assets/rish/rish_shizuku.dex')).hexdigest() == '1953c1fd9708904f8fc1f67774843b4cc3d03e5f2a578ff4d654d0625456bc28'
              for name in ('termux-rish', 'LICENSE', 'NOTICE'):
                  assert apk.read('assets/rish/' + name), name
          PY
      - name: Build sixel comparison harness from existing emulator classes
        if: env.BUILD_ALL_APKS != 'true'
        run: bash scripts/sixel-benchmark/build.sh "$RUNNER_TEMP/sixel-benchmark"
      - name: Attach sixel comparison harness
        if: env.BUILD_ALL_APKS != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sixel-benchmark
          path: ${{ runner.temp }}/sixel-benchmark/artifact/
          if-no-files-found: error
      - name: Build buffer comparison harness from existing emulator classes
        if: env.BUILD_ALL_APKS != 'true'
        run: bash scripts/buffer-benchmark/build.sh "$RUNNER_TEMP/buffer-benchmark"
      - name: Attach buffer comparison harness
        if: env.BUILD_ALL_APKS != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: buffer-benchmark
          path: ${{ runner.temp }}/buffer-benchmark/artifact/
          if-no-files-found: error
      - name: Build text comparison harness from existing emulator classes
        if: env.BUILD_ALL_APKS != 'true'
        run: bash scripts/text-benchmark/build.sh "$RUNNER_TEMP/text-benchmark"
      - name: Attach text comparison harness
        if: env.BUILD_ALL_APKS != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: text-benchmark
          path: ${{ runner.temp }}/text-benchmark/artifact/
          if-no-files-found: error
      - name: Attach universal APK file
        if: env.BUILD_ALL_APKS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_universal
          path: |
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_universal.apk
            ${{ env.APK_DIR_PATH }}/output-metadata.json
      - name: Attach arm64-v8a APK file
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_arm64-v8a
          path: |
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_arm64-v8a.apk
            ${{ env.APK_DIR_PATH }}/output-metadata.json
      - name: Attach armeabi-v7a APK file
        if: env.BUILD_ALL_APKS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_armeabi-v7a
          path: |
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_armeabi-v7a.apk
            ${{ env.APK_DIR_PATH }}/output-metadata.json
      - name: Attach x86_64 APK file
        if: env.BUILD_ALL_APKS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_x86_64
          path: |
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_x86_64.apk
            ${{ env.APK_DIR_PATH }}/output-metadata.json
      - name: Attach x86 APK file
        if: env.BUILD_ALL_APKS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_x86
          path: |
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_x86.apk
            ${{ env.APK_DIR_PATH }}/output-metadata.json
      - name: Attach sha256sums file
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_sha256sums
          path: |
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_sha256sums
            ${{ env.APK_DIR_PATH }}/output-metadata.json
