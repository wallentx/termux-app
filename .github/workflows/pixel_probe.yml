name: Pixel SDK and SIMD probe
on:
  workflow_dispatch:
  push:
    branches: [dev, 'wallentx/pixel/**']
    paths:
      - '.github/workflows/pixel_probe.yml'
      - 'app/src/pixelProbe/**'
      - 'app/build.gradle'
      - 'app/src/main/cpp/Android.mk'
      - 'terminal-emulator/**'
      - 'termux-shared/build.gradle'
      - 'scripts/pixel-probe/**'
  pull_request:
    paths:
      - '.github/workflows/pixel_probe.yml'
      - 'app/src/pixelProbe/**'
      - 'app/build.gradle'
      - 'app/src/main/cpp/Android.mk'
      - 'terminal-emulator/**'
      - 'termux-shared/build.gradle'
      - 'scripts/pixel-probe/**'
permissions:
  contents: read
jobs:
  diagnostic-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK and NDK
        run: sdkmanager 'platforms;android-37.2' 'platforms;android-36' 'build-tools;37.0.0' 'ndk;29.0.14206865'
      - name: Check report validator
        run: python3 -m unittest discover -s scripts/pixel-probe -p 'test_*.py'
      - name: Build ARM64 target-37 diagnostic APK
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_APK_VERSION_TAG: pixel-probe-debug
        run: ./gradlew --no-daemon :app:assembleDebug -PpixelProbe=true
      - name: Verify diagnostic artifact
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/termux-app_pixel-probe-debug_arm64-v8a.apk
          test -s "$apk"
          apkanalyzer manifest target-sdk "$apk" | grep -x 37
          apkanalyzer manifest min-sdk "$apk" | grep -x 37
          apkanalyzer manifest print "$apk" | grep -F com.termux.app.pixel.PixelProbeActivity
          python3 - "$apk" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              libraries = [n for n in apk.namelist() if n.startswith('lib/') and n.endswith('.so')]
              assert libraries, 'No native libraries packaged'
              assert {n.split('/')[1] for n in libraries} == {'arm64-v8a'}, libraries
              assert 'lib/arm64-v8a/libtermux-pixel-probe.so' in libraries
          PY
          sha256sum "$apk" > "$apk.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: pixel-probe-arm64-target37
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/termux-app_pixel-probe-debug_arm64-v8a.apk
            app/build/outputs/apk/debug/termux-app_pixel-probe-debug_arm64-v8a.apk.sha256
            app/build/outputs/apk/debug/output-metadata.json
