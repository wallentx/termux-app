buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.13.2"
    }
}

def requestedProfile = providers.gradleProperty("termuxBuildProfile").getOrElse("pixel11")
if (!(requestedProfile in ["pixel11", "all"])) {
    throw new GradleException("termuxBuildProfile must be 'pixel11' or 'all'")
}
ext.termuxArm64Only = requestedProfile == "pixel11" || providers.gradleProperty("pixelProbe").orNull == "true"

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}
